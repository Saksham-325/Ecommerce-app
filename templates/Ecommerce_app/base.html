<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>{% block title %}ShopEase{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'Ecommerce_app/style.css' %}?v=5">
  {% block extra_css %}{% endblock %}
</head>
<body>

  {% include 'Ecommerce_app/navbar.html' %}

  <div class="layout">

    {% include 'Ecommerce_app/sidebar.html' %}

    <main class="main-content">
      {% block content %}{% endblock %}

      {% include 'Ecommerce_app/footer.html' %}
    </main>

  </div>

  {% block extra_js %}{% endblock %}
</body>
</html>
